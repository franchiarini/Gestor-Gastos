<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let savedTheme = null
        try {
          savedTheme = localStorage.getItem('gestor-gastos-theme')
        } catch {}
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nido — Gestor de Gastos. Organizá tus gastos personales y compartidos de forma simple." />
    <link rel="icon" type="image/png" href="/public/dragon-mark.png" />
    <title>Nido — Gestor de Gastos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
